# ---------------------------------------------------------------------------
# Castle Rock lead pipeline configuration
# Copy to config.yaml and adjust. config.yaml is git-ignored.
# ---------------------------------------------------------------------------

# Geography: which addresses count as "Castle Rock". A lead is kept if its
# address contains the city string OR any of these ZIP codes.
geography:
  city: "CASTLE ROCK"
  zip_codes: ["80104", "80108", "80109"]

# --- Foreclosures (Douglas County Public Trustee) -------------------------
foreclosures:
  enabled: true
  # Douglas County Public Trustee foreclosure search (legacy Struts app).
  base_url: "https://apps.douglas.co.us/apps/publictrustee"
  # The results page is reached after accepting the disclaimer. Run
  #   python -m castlerock_leads check-endpoints
  # from your own network to confirm these before the first real run.
  search_path: "/propertySearch.do"
  details_path: "/propertyDetails.do"
  # Only keep foreclosures whose sale date is within this many days ahead
  # (0 = no upper bound). Helps focus on actionable, not-yet-sold properties.
  max_days_to_sale: 120

# --- Obituaries ------------------------------------------------------------
obituaries:
  enabled: true
  # Only surface decedents at or above this age (older owners are more likely
  # to have owned a paid-off home now entering an estate/probate sale).
  min_age: 65
  # If an obituary has no age, keep it (True) or drop it (False).
  keep_when_age_unknown: true
  sources:
    legacy: true       # legacy.com Castle Rock feed
    dignity: true       # dignitymemorial.com Castle Rock feed
  lookback_days: 3      # how far back to pull each run (dedup handles overlap)

# --- GIS / Assessor enrichment --------------------------------------------
# Cross-references each lead against Douglas County parcel + assessor data to
# attach a real property (address, account #, actual value, owner). This is
# the "connected to the GIS maps" piece.
enrichment:
  enabled: true
  parcels_mapserver: "https://apps.douglas.co.us/gisod/rest/services/Parcels/MapServer"
  # Layer index for the PARCELS layer inside the MapServer above. Confirm with
  # check-endpoints; it prints every layer id + name.
  parcels_layer_id: 5
  # Field names on the parcels layer. Confirmed per-county; defaults are the
  # most common Douglas County schema. check-endpoints prints the real fields.
  fields:
    owner: "OWNER_NAME"
    site_address: "SITE_ADDR"
    account: "ACCOUNT"
    city: "SITE_CITY"
    zip: "SITE_ZIP"
  # Assessor owner-name search (used to turn an obituary name into a parcel).
  assessor_search_url: "https://apps.douglas.co.us/assessor/web/"

# --- Output ----------------------------------------------------------------
output:
  dir: "output"          # CSV + HTML reports written here, dated
  keep_html: true
  keep_csv: true

# --- Email digest (optional) ----------------------------------------------
# Leave enabled: false to just write files. Credentials come from environment
# variables, never this file: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD.
email:
  enabled: false
  from_addr: "leads@example.com"
  to_addrs: ["aden@answeringagent.com"]
  subject_prefix: "[Castle Rock Leads]"

# --- HTTP behaviour --------------------------------------------------------
http:
  # Be a polite citizen of public servers: identify yourself and rate-limit.
  user_agent: "CastleRockLeadsBot/1.0 (+contact: aden@answeringagent.com)"
  min_delay_seconds: 2.0
  timeout_seconds: 30
  max_retries: 3
